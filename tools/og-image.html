<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--
  og.png (1200x630) の版下。1200x630 で開いてそのままスクリーンショットする。
  説明文: Rounded Mplus 1c（丸ゴシック / SIL OFL）
          https://github.com/google/fonts/tree/main/ofl/mplusrounded1c
  UI部分: IPAPGothic（日本語ゴシック。アプリのUIに合わせた素の字面）
  日本語フォントを明示しないと環境によって中国語フォントに落ち、
  「骨」「令」などが中国語字形で描かれるので必ず指定すること。
-->
<style>
*{box-sizing:border-box;margin:0;}
body{
  width:1200px;height:630px;background:#07090c;color:#e8ecf2;
  display:flex;flex-direction:column;justify-content:center;padding:0 78px;
  background-image:radial-gradient(900px 420px at 78% 8%, rgba(78,168,222,.16), transparent 60%),
                   radial-gradient(700px 380px at 12% 100%, rgba(242,166,90,.12), transparent 60%);
}
h1{font-family:"DejaVu Sans",sans-serif;font-size:82px;font-weight:700;letter-spacing:.01em;line-height:1.1;}
h1 span{color:#4ea8de;}
p{
  font-family:"Rounded Mplus 1c","M PLUS Rounded 1c",sans-serif;
  margin-top:26px;font-size:33px;font-weight:500;color:#a7b1c0;line-height:1.6;letter-spacing:.01em;
}
.rows{margin-top:50px;display:flex;flex-direction:column;gap:16px;width:816px;}
.row{display:flex;align-items:center;gap:14px;}
/* 行の見出しは実ページと同じ記号（映像=ビデオ、音声=ヘッドホン）。
   音声にスピーカーを使うと、実ページのミュート（スピーカー×）と
   紛らわしくなるのでヘッドホンにしてある */
.lab{width:60px;display:flex;align-items:center;justify-content:center;color:#93a0b2;}
.lab svg{display:block;}
.pill{
  flex:1;height:62px;border:1px solid #232a35;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-family:"DejaVu Sans",sans-serif;font-size:25px;font-weight:700;
  color:#7d8798;background:rgba(255,255,255,.04);
}
.pill.a{background:#4ea8de;border-color:#4ea8de;color:#04060a;}
.pill.b{background:#f2a65a;border-color:#f2a65a;color:#04060a;}
</style>
</head>
<body>
<h1>Stream <span>Switcher</span></h1>
<p>YouTubeの複数配信を並べて、映像と音声を別々に切り替える</p>
<div class="rows">
  <div class="row"><span class="lab" role="img" aria-label="映像"><svg viewBox="0 0 24 24" width="48" height="48"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></span>
    <span class="pill a">MAIN</span><span class="pill">VC-A</span><span class="pill">VC-B</span></div>
  <div class="row"><span class="lab" role="img" aria-label="音声"><svg viewBox="0 0 24 24" width="48" height="48"><path fill="currentColor" d="M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z"/></svg></span>
    <span class="pill">MAIN</span><span class="pill">VC-A</span><span class="pill b">VC-B</span></div>
</div>
</body>
</html>
